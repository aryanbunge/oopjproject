spring.application.name=weather-anomaly-detection
server.port=8080

# File-backed H2 database. The database files are local and are not committed to Git.
spring.datasource.url=jdbc:h2:file:./data/weatherdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Set OPENWEATHER_API_KEY in your environment; never put a real key in this file.
openweather.api-key=${OPENWEATHER_API_KEY:}
