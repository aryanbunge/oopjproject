spring.application.name=weather-anomaly-detection
server.port=8080

# File-backed H2 database. The database files are local and are not committed to Git.
spring.datasource.url=jdbc:h2:file:./data/weatherdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Serve the frontend from the web/ directory
spring.web.resources.static-locations=file:./web/,classpath:/static/,classpath:/public/
# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Set OPENWEATHER_API_KEY in your environment or in the git-ignored .env file.
openweather.api-key=${OPENWEATHER_API_KEY:}
